name: Verify and Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pr-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run unit tests and offline catalogue verification
        run: |
          python scripts/test-site.py -v
          python scripts/verify-films.py
          node --check portfolio.js
          node --check script.js
          node --check scripts/check-rendered.mjs

      - name: Run rendered Chrome CDP audit
        run: node scripts/check-rendered.mjs

      - name: Stage static site artifact
        env:
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          python - <<'PY'
          import os, shutil, subprocess
          from pathlib import Path

          root = Path('.').resolve()
          dest = Path(os.environ['SITE_DIR']).resolve()
          if dest.exists():
              shutil.rmtree(dest)
          dest.mkdir(parents=True)

          excluded_prefixes = ('.github/', 'scripts/')
          excluded_files = {'.gitignore', 'README.md'}

          listing = subprocess.run(
              ['git', 'ls-files', '-z'], capture_output=True, text=True, check=True
          ).stdout
          copied = 0
          for rel in listing.split('\0'):
              if not rel:
                  continue
              if rel in excluded_files or rel.startswith(excluded_prefixes):
                  continue
              src = root / rel
              out = dest / rel
              out.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, out)
              copied += 1

          required = [
              'CNAME', 'index.html', 'music.html', 'films.html', '404.html',
              'portfolio.css', 'styles.css', 'portfolio.js', 'script.js',
              'releases.json', 'films.json', 'robots.txt', 'sitemap.xml',
              'assets', 'lyrics',
          ]
          for item in required:
              assert (dest / item).exists(), f'Missing staged path: {item}'
          for forbidden in ['scripts', 'README.md', '.git', '.github', '.gitignore']:
              assert not (dest / forbidden).exists(), f'Forbidden path staged: {forbidden}'

          print(f'Staged {copied} public files into {dest}')
          PY

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
