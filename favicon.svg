<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <radialGradient id="hearthGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background disk -->
  <circle cx="32" cy="32" r="30" fill="url(#skyGrad)" stroke="#374151" stroke-width="1.5" />
  <circle cx="32" cy="32" r="30" fill="url(#hearthGlow)" />

  <!-- Guiding North Star -->
  <g filter="url(#glowFilter)">
    <path d="M32 10 L33.5 16 L39.5 17.5 L33.5 19 L32 25 L30.5 19 L24.5 17.5 L30.5 16 Z" fill="#FDE68A" />
  </g>

  <!-- Arch of Refuge / Sanctuary Dome -->
  <path d="M16 38 C16 23 48 23 48 38" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.5 3.5" opacity="0.75" />

  <!-- Nest Base / Welcoming Vessel -->
  <path d="M18 40 C22 49 42 49 46 40" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M22 43 C26 49 38 49 42 43" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Hearth Flame / Inner Radiance -->
  <path d="M32 28 C34 32 37 34 35 39 C33.5 42 30.5 42 29 39 C27 34 30 32 32 28 Z" fill="url(#goldGrad)" filter="url(#glowFilter)" />
</svg>
